name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  static-check:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile app.py

      - name: Project checks
        run: python scripts/check_project.py
      - name: GUI interaction and regression tests (synthetic/offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          MPE_GUI_QA_OUTPUT: gui-qa-artifacts
          PYTHONUNBUFFERED: "1"
        run: python -m unittest discover -v -s tests -p "test_*.py"

      - name: Upload synthetic GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manga-peta-synthetic-gui-qa
          path: gui-qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
