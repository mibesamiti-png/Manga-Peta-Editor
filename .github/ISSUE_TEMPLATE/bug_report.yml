name: Bug report
description: Report a Manga Peta Editor bug
title: "[BUG] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Write the exact operation sequence.
    validations:
      required: true
  - type: textarea
    id: selected
    attributes:
      label: Selected object(s)
      description: image / text / panel / multiple selection etc.
  - type: input
    id: page
    attributes:
      label: Page number
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      render: shell
  - type: textarea
    id: notes
    attributes:
      label: Notes
